<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Carter's Climb</title>
<style>
  :root {
    --sky: #f4efe6;
    --ink: #1d1d1f;
    --muted: #8a857c;
    --accent: #ff5a36;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--sky); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; gap: 20px; align-items: center;
    font-weight: 700; font-size: 15px; pointer-events: none; }
  .hud .dist { font-size: 28px; letter-spacing: -0.5px; }
  .hud .dist small { font-size: 14px; color: var(--muted); margin-left: 2px; }
  .fuel { width: 110px; height: 10px; border-radius: 6px; background: rgba(0,0,0,.1); overflow: hidden; }
  .fuel i { display: block; height: 100%; width: 100%; background: var(--ink); border-radius: 6px; transition: background .2s; }
  .fuel.low i { background: var(--accent); }
  .spacer { flex: 1; }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-right: 6px; }
  .pedal { position: fixed; bottom: 20px; width: 92px; height: 92px; border-radius: 50%;
    background: rgba(29,29,31,.08); border: 2px solid rgba(29,29,31,.15); display: grid; place-items: center;
    font-weight: 800; font-size: 13px; letter-spacing: 1px; color: var(--muted); }
  .pedal.on { background: rgba(29,29,31,.2); color: var(--ink); }
  #brake { left: 20px; } #gas { right: 20px; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(244,239,230,.82);
    backdrop-filter: blur(4px); text-align: center; padding: 16px; }
  .overlay.hidden { display: none; }
  .card h1 { font-size: 44px; letter-spacing: -1.5px; line-height: 1; }
  .card p { color: var(--muted); margin-top: 10px; font-size: 15px; }
  .face { width: 96px; height: 110px; border-radius: 28px; margin: 0 auto 18px; background-size: cover;
    background-position: 50% 45%; border: 4px solid var(--ink); }
  .card button { margin-top: 22px; font: inherit; font-weight: 800; font-size: 16px; padding: 14px 34px;
    border-radius: 999px; border: 0; background: var(--ink); color: var(--sky); cursor: pointer; }
  .keys { margin-top: 14px; font-size: 13px; }
  .cars { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .card .cars button { margin: 0; padding: 9px 16px; font-size: 14px; background: rgba(0,0,0,.08); color: var(--ink); border: 2px solid transparent; }
  .card .cars button.sel { border-color: var(--ink); background: #fff; }
  .card .cars button i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  kbd { font: inherit; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.08); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="dist"><span id="dist">0</span><small>m</small></div>
  <div><span class="label">Fuel</span></div>
  <div class="fuel" id="fuelBar"><i id="fuel"></i></div>
  <div class="spacer"></div>
  <div><span class="label">Coins</span><span id="coins">0</span></div>
</div>

<div class="pedal" id="brake">BRAKE</div>
<div class="pedal" id="gas">GAS</div>

<div class="overlay" id="menu">
  <div class="card">
    <div class="face" id="menuFace"></div>
    <h1>Carter's Climb</h1>
    <p id="menuSub">Drive as far as you can. Don't bonk Carter's head.</p>
    <div class="cars"></div>
    <button id="play">Play</button>
    <p class="keys"><kbd>→</kbd> / <kbd>D</kbd> gas &nbsp; <kbd>←</kbd> / <kbd>A</kbd> brake &nbsp;·&nbsp; lean in the air</p>
  </div>
</div>

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;

  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cvs.width = W * DPR; cvs.height = H * DPR;
}
addEventListener('resize', resize); resize();

const carter = new Image();
carter.src = CARTER_SRC;
document.getElementById('menuFace').style.backgroundImage = `url(${CARTER_SRC})`;

// ---------- terrain (world is y-up) ----------
let seed = Math.random() * 1000;
function ground(x) {
  if (x < 400) return 0;
  const t = x - 400;
  const ramp = Math.min(1, t / 600);
  const amp = ramp * (1 + t / 9000);
  return amp * (
    55 * Math.sin(t * 0.0035 + seed) +
    28 * Math.sin(t * 0.009 + seed * 2.1) +
    12 * Math.sin(t * 0.023 + seed * 0.7)
  ) + t * 0.02;
}
function slope(x) { return (ground(x + 1) - ground(x - 1)) / 2; }

// ---------- state ----------
const CARS = [
  { name: 'Jeep',    color: '#ff5a36', R: 17, BASE: 74, ACC: 950,  VMAX: 900,  SPIN: 9 },
  { name: 'Monster', color: '#7b5cff', R: 26, BASE: 84, ACC: 1100, VMAX: 800,  SPIN: 7 },
  { name: 'Buggy',   color: '#1fb57a', R: 14, BASE: 66, ACC: 1300, VMAX: 1200, SPIN: 12 },
  { name: 'Tractor', color: '#ffb21f', R: 21, BASE: 78, ACC: 1600, VMAX: 550,  SPIN: 6 },
];
const G = 1100;
let carIdx = 0, R, BASE, ACC, VMAX, SPIN, COLOR;
function pickCar(i) {
  carIdx = i; ({ R, BASE, ACC, VMAX, SPIN, color: COLOR } = CARS[i]);
  document.querySelectorAll('.cars button').forEach((b, j) => b.classList.toggle('sel', j === i));
}
let wheels, coins, cans, fuel, nCoins, best, state, camX, camY, outTimer, wheelRot, keys = { gas: false, brake: false }, lastT;
try { best = +localStorage.getItem('carter-best') || 0; } catch (e) { best = 0; }

function reset() {
  seed = Math.random() * 1000;
  wheels = [
    { x: 100, y: R + 2, vx: 0, vy: 0, g: false },
    { x: 100 + BASE, y: R + 2, vx: 0, vy: 0, g: false },
  ];
  coins = []; cans = [];
  for (let x = 700; x < 200000; x += 520 + Math.random() * 500) {
    const n = 4 + (Math.random() * 4 | 0);
    for (let i = 0; i < n; i++) coins.push({ x: x + i * 34, got: false });
  }
  for (let x = 1500; x < 200000; x += 2200 + x * 0.04) cans.push({ x, got: false });
  fuel = 100; nCoins = 0; outTimer = 0; wheelRot = 0;
  camX = 0; camY = 0;
}

function step(h) {
  const [a, b] = wheels;
  const anyGround = a.g || b.g;
  const gas = keys.gas && fuel > 0, brake = keys.brake;

  // lean torque: strong in air, a little on the ground
  let ax = b.x - a.x, ay = b.y - a.y, len = Math.hypot(ax, ay);
  const px = -ay / len, py = ax / len;
  const lean = (gas ? 1 : 0) - (brake ? 1 : 0);
  const k = lean * SPIN * (anyGround ? 0.12 : 1) * 60 * h;
  b.vx += px * k; b.vy += py * k; a.vx -= px * k; a.vy -= py * k;

  for (const w of wheels) {
    w.vy -= G * h;
    w.px = w.x; w.py = w.y;
    w.x += w.vx * h; w.y += w.vy * h;
  }

  // distance constraint between wheels
  for (let it = 0; it < 3; it++) {
    ax = b.x - a.x; ay = b.y - a.y; len = Math.hypot(ax, ay);
    const d = (len - BASE) / len / 2;
    a.x += ax * d; a.y += ay * d; b.x -= ax * d; b.y -= ay * d;

    for (const w of wheels) {
      const s = slope(w.x), nl = Math.hypot(s, 1);
      const nx = -s / nl, ny = 1 / nl;
      const dist = (w.y - ground(w.x)) * ny;
      if (dist < R) { w.x += nx * (R - dist); w.y += ny * (R - dist); }
    }
  }

  for (const w of wheels) {
    w.vx = (w.x - w.px) / h; w.vy = (w.y - w.py) / h;
    const s = slope(w.x), nl = Math.hypot(s, 1);
    const nx = -s / nl, ny = 1 / nl, tx = 1 / nl, ty = s / nl;
    const dist = (w.y - ground(w.x)) * ny;
    w.g = dist < R + 1.5;
    if (w.g) {
      let vn = w.vx * nx + w.vy * ny, vt = w.vx * tx + w.vy * ty;
      if (vn < 0) vn *= -0.1;
      if (gas && vt < VMAX) vt += ACC * h;
      else if (brake) vt -= (vt > 0 ? ACC * 1.4 : ACC * 0.6) * h;
      else vt *= 1 - 0.4 * h;
      if (brake && vt < -VMAX * 0.4) vt = -VMAX * 0.4;
      w.vx = tx * vt + nx * vn; w.vy = ty * vt + ny * vn;
    }
  }
}

function car() {
  const [a, b] = wheels;
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const ux = -Math.sin(ang), uy = Math.cos(ang); // car "up"
  return { ang, mx, my, ux, uy, vx: (a.vx + b.vx) / 2 };
}

function update(dt) {
  if (state !== 'play') return;
  const sub = 6, h = dt / sub;
  for (let i = 0; i < sub; i++) step(h);

  const c = car();
  fuel -= dt * (keys.gas ? 4.2 : 1.6);
  if (fuel < 0) fuel = 0;

  // pickups
  for (const o of coins) if (!o.got && Math.abs(o.x - c.mx) < 30 && Math.abs(ground(o.x) + 36 - (c.my + c.uy * 20)) < 50) { o.got = true; nCoins++; }
  for (const o of cans) if (!o.got && Math.abs(o.x - c.mx) < 36 && Math.abs(ground(o.x) + 30 - (c.my + c.uy * 20)) < 60) { o.got = true; fuel = 100; }

  // head bonk: Carter's head sits up in the cabin
  const hx = c.mx + c.ux * 58 - Math.cos(c.ang) * 4, hy = c.my + c.uy * 58 - Math.sin(c.ang) * 4;
  if (hy - ground(hx) < 16 && c.uy < 0.3) return end('Carter bonked his head!');

  if (fuel <= 0 && Math.abs(c.vx) < 25) { outTimer += dt; if (outTimer > 1.5) return end('Out of fuel!'); }
  else outTimer = 0;

  wheelRot -= c.vx * dt / R;

  const tx = c.mx - W * 0.33, ty = c.my - H * 0.42;
  camX += (tx - camX) * Math.min(1, dt * 8);
  camY += (ty - camY) * Math.min(1, dt * 4);

  const m = Math.max(0, Math.floor((c.mx - 100) / 20));
  document.getElementById('dist').textContent = m;
  document.getElementById('fuel').style.width = fuel + '%';
  document.getElementById('fuelBar').classList.toggle('low', fuel < 25);
  document.getElementById('coins').textContent = nCoins;
}

function end(msg) {
  state = 'over';
  const m = Math.max(0, Math.floor((car().mx - 100) / 20));
  const newBest = m > best;
  if (newBest) { best = m; try { localStorage.setItem('carter-best', best); } catch (e) {} }
  document.getElementById('menu').querySelector('h1').textContent = msg;
  document.getElementById('menuSub').textContent = `${m} m · ${nCoins} coins · ${newBest ? 'new best!' : 'best ' + best + ' m'}`;
  document.getElementById('play').textContent = 'Again';
  setTimeout(() => document.getElementById('menu').classList.remove('hidden'), 500);
}

// ---------- render ----------
const sx = x => x - camX, sy = y => H - (y - camY);

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawWheel(w) {
  ctx.save(); ctx.translate(sx(w.x), sy(w.y)); ctx.rotate(-wheelRot);
  ctx.fillStyle = '#1d1d1f'; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  ctx.fillStyle = '#f4efe6'; ctx.beginPath(); ctx.arc(0, 0, R * 0.45, 0, 7); ctx.fill();
  ctx.fillStyle = '#1d1d1f'; ctx.fillRect(-1.5, -R * 0.45, 3, R * 0.9);
  ctx.restore();
}

function drawCar() {
  const c = car();
  const [a, b] = wheels;
  // suspension struts
  ctx.strokeStyle = '#8a857c'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (const w of [a, b]) {
    const off = w === a ? -BASE / 2 : BASE / 2;
    const bx = c.mx + Math.cos(c.ang) * off + c.ux * 14, by = c.my + Math.sin(c.ang) * off + c.uy * 14;
    ctx.beginPath(); ctx.moveTo(sx(w.x), sy(w.y)); ctx.lineTo(sx(bx), sy(by)); ctx.stroke();
  }

  ctx.save();
  ctx.translate(sx(c.mx), sy(c.my));
  ctx.rotate(-c.ang);
  // body (screen space: up is -y)
  ctx.fillStyle = COLOR;
  roundRect(-54, -36, 108, 22, 9); ctx.fill();
  // cabin frame
  ctx.strokeStyle = '#1d1d1f'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-26, -36); ctx.lineTo(-24, -84); ctx.lineTo(16, -84); ctx.lineTo(30, -36); ctx.stroke();
  // Carter
  const fw = 44, fh = 52, fx = -24, fy = -88 + Math.sin(performance.now() / 140) * 0.8;
  ctx.save();
  roundRect(fx, fy, fw, fh, 14); ctx.clip();
  if (carter.complete && carter.naturalWidth) ctx.drawImage(carter, 30, 140, 280, 320, fx, fy, fw, fh);
  ctx.restore();
  ctx.strokeStyle = '#1d1d1f'; ctx.lineWidth = 2.5; roundRect(fx, fy, fw, fh, 14); ctx.stroke();
  // seat + headlight
  ctx.fillStyle = '#1d1d1f'; roundRect(-34, -48, 12, 14, 3); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(51, -27, 4, 0, 7); ctx.fill();
  ctx.restore();

  drawWheel(a); drawWheel(b);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#9fd3f0'); sky.addColorStop(1, '#f4efe6');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (let i = 0; i < 6; i++) {
    const x = ((i * 337 - camX * 0.1) % (W + 200) + W + 200) % (W + 200) - 100, y = 60 + (i * 53) % 140;
    ctx.beginPath(); ctx.ellipse(x, y, 46, 14, 0, 0, 7); ctx.ellipse(x + 22, y - 9, 26, 14, 0, 0, 7); ctx.fill();
  }

  // far hills (parallax)
  ctx.fillStyle = '#e8e0d2'; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 20) {
    const wx = x + camX * 0.3;
    ctx.lineTo(x, H * 0.62 - 60 * Math.sin(wx * 0.002 + 1) - 30 * Math.sin(wx * 0.005) + camY * 0.15 * -1 * 0);
  }
  ctx.lineTo(W, H); ctx.fill();

  // ground
  ctx.fillStyle = '#1d1d1f'; ctx.beginPath(); ctx.moveTo(-10, H + 10);
  for (let x = -10; x <= W + 10; x += 6) ctx.lineTo(x, sy(ground(x + camX)));
  ctx.lineTo(W + 10, H + 10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#7bc96f'; ctx.lineWidth = 5; ctx.beginPath();
  for (let x = -10; x <= W + 10; x += 6) { const y = sy(ground(x + camX)) + 2; x === -10 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke();

  // distance markers
  ctx.fillStyle = '#8a857c'; ctx.font = '700 11px system-ui'; ctx.textAlign = 'center';
  for (let m = Math.ceil((camX - 100) / 2000) * 100; m * 20 + 100 < camX + W; m += 100) {
    if (m <= 0) continue;
    const x = m * 20 + 100; const y = sy(ground(x));
    ctx.fillRect(sx(x) - 1, y - 40, 2, 40); ctx.fillText(m + ' m', sx(x), y - 46);
  }

  // coins
  for (const o of coins) {
    if (o.got || o.x < camX - 40 || o.x > camX + W + 40) continue;
    const x = sx(o.x), y = sy(ground(o.x) + 36);
    ctx.fillStyle = '#ffc93c'; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = '#e0a400'; ctx.lineWidth = 2; ctx.stroke();
  }
  // fuel cans
  for (const o of cans) {
    if (o.got || o.x < camX - 40 || o.x > camX + W + 40) continue;
    const x = sx(o.x), y = sy(ground(o.x) + 30);
    ctx.fillStyle = '#ff5a36'; roundRect(x - 11, y - 14, 22, 28, 5); ctx.fill();
    ctx.fillStyle = '#f4efe6'; ctx.font = '800 12px system-ui'; ctx.fillText('F', x, y + 4);
  }

  if (wheels) drawCar();
}

function loop(t) {
  const dt = Math.min(0.033, (t - (lastT || t)) / 1000); lastT = t;
  update(dt); render();
  requestAnimationFrame(loop);
}

// ---------- input ----------
const keyMap = { ArrowRight: 'gas', KeyD: 'gas', ArrowUp: 'gas', ArrowLeft: 'brake', KeyA: 'brake', ArrowDown: 'brake' };
addEventListener('keydown', e => {
  if (keyMap[e.code]) { keys[keyMap[e.code]] = true; e.preventDefault(); sync(); }
  if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') start();
});
addEventListener('keyup', e => { if (keyMap[e.code]) { keys[keyMap[e.code]] = false; sync(); } });
for (const id of ['gas', 'brake']) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { keys[id] = true; el.setPointerCapture(e.pointerId); sync(); });
  const up = () => { keys[id] = false; sync(); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
function sync() {
  document.getElementById('gas').classList.toggle('on', keys.gas);
  document.getElementById('brake').classList.toggle('on', keys.brake);
}

function start() {
  reset(); state = 'play';
  document.getElementById('menu').classList.add('hidden');
}
document.getElementById('play').addEventListener('click', start);

document.querySelector('.cars').innerHTML = CARS.map((c, i) => `<button data-i="${i}"><i style="background:${c.color}"></i>${c.name}</button>`).join('');
document.querySelectorAll('.cars button').forEach(b => b.addEventListener('click', () => pickCar(+b.dataset.i)));
pickCar(0);
reset(); state = 'menu';
requestAnimationFrame(loop);
</script>
</body>
</html>
